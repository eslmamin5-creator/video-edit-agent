[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "video-edit-agent"
version = "0.2.2"
description = "Arabic-first, provider-agnostic AI video editing agent (CLI: videoedit)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "video-edit-agent contributors" }]
keywords = ["video", "editing", "arabic", "ffmpeg", "ai", "captions"]

dependencies = [
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.0", "arabic-reshaper>=3.0", "python-bidi>=0.4"]
gemini = ["google-genai>=0.3"]
elevenlabs = ["elevenlabs>=1.0"]
motion = ["manim>=0.18"]
# mediapipe is pinned exactly, not range-bounded: fresh-install testing found
# that 0.10.35 (still <1.0) has ALREADY dropped the legacy
# mediapipe.solutions.selfie_segmentation API this project's adapter needs --
# "mediapipe<1.0" alone is not a safe bound. 0.10.21 is the last version
# verified (by direct import test) to still expose it.
subject = ["mediapipe==0.10.21", "opencv-python-headless>=4.9"]
# arabic-reshaper/python-bidi (not reportlab) are included here because
# tests/test_arabic_ux_onboarding.py::test_inline_shaping_never_corrupts_reportlab_tags_with_mixed_arabic_code
# unit-tests scripts/build_user_guide.py::_shape_arabic/_render_inline
# directly (no importorskip guard, unlike the full PDF-build smoke test).
# reportlab is deliberately left out of "dev": adding it would let the CI
# test env satisfy test_build_user_guide_produces_both_pdfs's importorskip
# guards and run the actual PDF build, which downloads an Arabic font over
# the network on first run -- installing the full "docs" extra in CI/dev is
# what we're avoiding here, not just picking a smaller extra name.
dev = [
  "pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.4", "mypy>=1.10",
  "arabic-reshaper>=3.0", "python-bidi>=0.4",
]
# Documentation tooling only -- never imported by the runtime pipeline.
# Used solely by scripts/build_user_guide.py to render docs/USER_GUIDE*.md
# into the PDF user guides. arabic-reshaper/python-bidi are already runtime
# deps under "local"/"full-local" and are reused here for Arabic PDF shaping.
docs = ["reportlab>=4.0", "markdown>=3.5", "arabic-reshaper>=3.0", "python-bidi>=0.4"]
# Recommended offline install profile (spec v0.2.1 installation UX): everything
# needed for Editor/Creator/Assembler fully offline -- local transcription,
# Arabic captions, behind-subject compositing, local motion. No cloud SDKs.
#
# manim is intentionally excluded here: it needs system Cairo/Pango libraries
# that are frequently missing on fresh Linux/Windows installs (confirmed via
# fresh-install testing -- pip wheel build fails with
# "pangocairo >= 1.30.0 is required" when those system libs aren't present),
# and it is never load-bearing -- local motion already works fully offline
# via the built-in simple motion engine. Use the "motion" profile explicitly
# to opt into manim once its system dependencies are installed.
full-local = [
  "faster-whisper>=1.0", "arabic-reshaper>=3.0", "python-bidi>=0.4",
  "mediapipe==0.10.21", "opencv-python-headless>=4.9",
]
all = [
  "faster-whisper>=1.0", "arabic-reshaper>=3.0", "python-bidi>=0.4",
  "google-genai>=0.3", "elevenlabs>=1.0", "manim>=0.18",
  "mediapipe==0.10.21", "opencv-python-headless>=4.9",
]

[project.scripts]
videoedit = "video_edit_agent.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/video_edit_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# Typer's CLI parameter idiom requires calling typer.Argument()/typer.Option()
# as a function-call default; this is the documented, required pattern, not a
# mutable-default bug that B008 is meant to catch.
"src/video_edit_agent/cli/main.py" = ["B008"]
"src/video_edit_agent/cli/config.py" = ["B008"]
